spring.application.name=Spring_AI_Demo



spring.ai.google.genai.chat.model=gemini-3.1-flash-lite
spring.ai.google.genai.chat.temperature=0.7

spring.ai.google.genai.embedding.text.model=gemini-embedding-2
# Set these via environment variables or local untracked config
spring.ai.google.genai.embedding.api-key=${GOOGLE_GENAI_API_KEY}
spring.ai.google.genai.api-key=${GOOGLE_GENAI_API_KEY}

# MCP client integration (Spring AI 2.0)
# Keep disabled by default to avoid startup failures on machines without Node/npx.
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.name=email-server
spring.ai.mcp.client.version=1.0.0
spring.ai.mcp.client.request-timeout=30s
spring.ai.mcp.client.initialized=true
spring.ai.mcp.client.toolcallback.enabled=true

# Use only the custom email-service MCP tool over streamable HTTP.
# The custom server must expose a streamable MCP endpoint (commonly /mcp).
# Keep stdio configuration disabled to avoid duplicate/competing MCP transport subscriptions.
# spring.ai.mcp.client.stdio.servers-configuration=classpath:mcp-servers.json
spring.ai.mcp.client.streamable-http.connections.email-service.url=http://localhost:8083/mcp

logging.level.org.springframework.ai.mcp=DEBUG
logging.level.org.springframework.ai.tool=DEBUG